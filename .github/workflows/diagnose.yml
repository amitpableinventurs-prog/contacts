name: Diagnose server

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: SSH Diagnose
    runs-on: ubuntu-latest

    steps:
      - name: Inspect server state
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 5m
          script: |
            cd "$HOME/public_html/new_contacts"
            echo "=== git status ==="
            git log --oneline -1; git status --short | head -20
            echo "=== FIX: move manager@test.com to team 1 ==="
            php artisan tinker --execute="\$u = App\Models\User::where('email','manager@test.com')->first(); if (\$u) { echo 'before: team='.\$u->current_team_id.PHP_EOL; \$u->update(['current_team_id' => 1]); echo 'after: team='.\$u->fresh()->current_team_id.PHP_EOL; } else { echo 'user not found'.PHP_EOL; }"
            echo "=== trash page contents check (team 1) ==="
            php artisan tinker --execute="\$rows = App\Models\Contact::onlyTrashed()->where('team_id',1)->get(['id','name','team_id','deleted_at','approval_status']); echo 'onlyTrashed count team 1: '.\$rows->count().PHP_EOL; \$rows->take(15)->each(fn(\$c)=>print('id='.\$c->id.' name='.\$c->name.' team='.\$c->team_id.' deleted_at='.\$c->deleted_at.' approval='.\$c->approval_status.PHP_EOL));"
            echo "=== sanity: any non-null deleted_at excluded from onlyTrashed? ==="
            php artisan tinker --execute="echo 'total incl trashed (team1): '.App\Models\Contact::withTrashed()->where('team_id',1)->count().PHP_EOL; echo 'active (team1): '.App\Models\Contact::where('team_id',1)->count().PHP_EOL; echo 'onlyTrashed (team1): '.App\Models\Contact::onlyTrashed()->where('team_id',1)->count().PHP_EOL;"
