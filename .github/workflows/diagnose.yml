name: Diagnose server

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: SSH Diagnose
    runs-on: ubuntu-latest

    steps:
      - name: Inspect server state
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 5m
          script: |
            cd "$HOME/public_html/new_contacts"
            echo "=== git status ==="
            git log --oneline -1; git status --short | head -20
            echo "=== recent DB-related errors in laravel.log ==="
            tail -n 400 storage/logs/laravel.log 2>/dev/null | grep -iE "duplicate entry|auto_increment|SQLSTATE|integrity constraint" | tail -30
            echo "=== tags / groups / contacts id vs auto_increment ==="
            php artisan tinker --execute="echo 'tags max id: ' . (App\Models\Tag::max('id') ?? 0) . ' | count: ' . App\Models\Tag::count() . PHP_EOL; \$t = DB::select(\"SHOW TABLE STATUS LIKE 'tags'\"); echo 'tags AUTO_INCREMENT: ' . (\$t[0]->Auto_increment ?? 'n/a') . PHP_EOL;"
            php artisan tinker --execute="echo 'groups max id: ' . (App\Models\Group::max('id') ?? 0) . ' | count: ' . App\Models\Group::count() . PHP_EOL; \$g = DB::select(\"SHOW TABLE STATUS LIKE 'groups'\"); echo 'groups AUTO_INCREMENT: ' . (\$g[0]->Auto_increment ?? 'n/a') . PHP_EOL;"
            php artisan tinker --execute="echo 'contacts max id: ' . (App\Models\Contact::withTrashed()->max('id') ?? 0) . ' | count(incl trashed): ' . App\Models\Contact::withTrashed()->count() . PHP_EOL; \$c = DB::select(\"SHOW TABLE STATUS LIKE 'contacts'\"); echo 'contacts AUTO_INCREMENT: ' . (\$c[0]->Auto_increment ?? 'n/a') . PHP_EOL;"
            echo "=== users: role + current_team_id ==="
            php artisan tinker --execute="App\Models\User::all(['id','name','email','current_team_id','role'])->each(fn(\$u) => print(\$u->id.' | '.\$u->email.' | team='.\$u->current_team_id.' | role='.\$u->role.PHP_EOL));"
            echo "=== last 10 contacts created: id, team_id, owner_id, created_at ==="
            php artisan tinker --execute="App\Models\Contact::withTrashed()->latest('id')->take(10)->get(['id','team_id','owner_id','created_at'])->each(fn(\$c) => print('id='.\$c->id.' team='.\$c->team_id.' owner='.\$c->owner_id.' at='.\$c->created_at.PHP_EOL));"
